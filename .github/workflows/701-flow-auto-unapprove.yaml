# SPDX-License-Identifier: Apache-2.0
name: "701: [FLOW] Auto Unapprove PR"
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-unapprove:
    name: Auto Unapprove PR
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-node: "true"
          node-version: "24"

      - name: Dismiss Reviews from Code Owners and Teams
        uses: PandasWhoCode/auto-unapprove-plus@eb5be4aa789d603cc62320ae3540aca36d3ab567 # main (2026-09-25)
        with:
          github-token: ${{ secrets.GH_AUTO_UNAPPROVE_TOKEN }}
          team-token: ${{ secrets.TEAM_MEMBERS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          dry-run: "false"
          code-owners-file: ".github/CODEOWNERS"
          target-branch: ${{ github.event.pull_request.base.ref }}
          # "@%/" expands to this repository's organization, matching the
          # "@%/platform-ci" entries in CODEOWNERS.
          team-start-with: "@%/"
