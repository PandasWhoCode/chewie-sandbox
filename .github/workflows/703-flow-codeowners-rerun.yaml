# SPDX-License-Identifier: Apache-2.0
name: "703: [FLOW] Codeowners Rerun"
on:
  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited

defaults:
  run:
    shell: bash

permissions:
  actions: write

concurrency:
  group: codeowners-rerun-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-codeowners:
    name: Rerun Codeowners Check
    runs-on: ubuntu-latest
    steps:
      # A review changes whether the codeowners check should pass, but the
      # existing 702 run has already finished and its check run is frozen.
      # Starting a second 702 run would leave the first one behind as a stale
      # red or cancelled check on the same commit, so instead re-run the
      # existing run: that updates its check in place, red <-> green, and
      # leaves exactly one "Codeowners Check" on the commit.
      - name: Rerun the codeowners check for this commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const workflow = '702-flow-codeowners.yaml';

            const latestRun = async () => {
              const res = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, head_sha: sha, per_page: 20,
              });
              const runs = res.data.workflow_runs;
              if (runs.length === 0) return null;
              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              return runs[0];
            };

            let run = await latestRun();
            if (!run) {
              core.info(`No ${workflow} run found for ${sha}; nothing to re-run.`);
              return;
            }

            // A run that is still going has probably already read the review
            // state from before this event, so wait for it rather than racing
            // it. Re-running is only possible once it has completed anyway.
            const deadline = Date.now() + 10 * 60 * 1000;
            while (run.status !== 'completed' && Date.now() < deadline) {
              core.info(`Run ${run.id} is ${run.status}; waiting for it to finish...`);
              await new Promise((r) => setTimeout(r, 15000));
              run = await latestRun();
            }

            if (run.status !== 'completed') {
              core.warning(`Run ${run.id} is still ${run.status} after 10m; skipping re-run.`);
              return;
            }

            core.info(`Re-running run ${run.id} (previous conclusion: ${run.conclusion}).`);
            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
